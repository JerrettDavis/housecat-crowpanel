[platformio]
default_envs = crowpanel_idf5
src_dir = src
include_dir = include
lib_dir = lib

[housecat]
platform = espressif32@7.0.1
board = crowpanel_esp32s3_213
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_compat_mode = strict
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
    -DHOUSECAT_PLATFORMIO_BUILD=1
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3

[env:crowpanel]
platform = ${housecat.platform}
board = ${housecat.board}
framework = ${housecat.framework}
monitor_speed = ${housecat.monitor_speed}
monitor_filters = ${housecat.monitor_filters}
upload_speed = ${housecat.upload_speed}
board_build.partitions = ${housecat.board_build.partitions}
board_build.filesystem = ${housecat.board_build.filesystem}
lib_ldf_mode = ${housecat.lib_ldf_mode}
lib_compat_mode = ${housecat.lib_compat_mode}
build_unflags = ${housecat.build_unflags}
build_flags = ${housecat.build_flags}
lib_deps = ${housecat.lib_deps}

; Shipping ESP-IDF 5.x baseline required by the MicroLink Tailscale client.
; The older crowpanel environment remains available as a rollback build.
[env:crowpanel_idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ${housecat.board}
framework = arduino
extra_scripts =
    pre:tools/pio_idf5_compat.py
    pre:tools/pio_microlink.py
monitor_speed = ${housecat.monitor_speed}
upload_speed = ${housecat.upload_speed}
board_build.partitions = ${housecat.board_build.partitions}
lib_ldf_mode = ${housecat.lib_ldf_mode}
lib_compat_mode = soft
build_unflags = ${housecat.build_unflags}
build_flags = ${housecat.build_flags}
    -DHOUSECAT_TAILSCALE=1
    -DCONFIG_ML_MAX_PEERS=8
    -DCONFIG_ML_NVS_MAX_PEERS=32
    -DCONFIG_ML_H2_BUFFER_SIZE_KB=256
    -DCONFIG_ML_JSON_BUFFER_SIZE_KB=256
    -DCONFIG_ML_PRIORITY_PEER_IP=\"\"
    -DCONFIG_ML_DEVICE_NAME=\"housecat-desk-01\"
lib_deps = ${housecat.lib_deps}
