name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platformio.txt
      - name: Validate tag and source
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
          python tools/verify_repo.py
          python tools/security_audit.py
      - name: Install and build
        run: |
          python -m pip install -r requirements-platformio.txt
          python -m platformio run -e crowpanel_idf5
          python tools/export_firmware.py --env crowpanel_idf5
      - name: Package clean source
        run: python tools/package_source.py --output ../release
      - name: Publish checksummed assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          find dist ../release -type f \( -name '*.bin' -o -name '*.json' -o -name '*.sha256' -o -name '*.zip' \) -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
