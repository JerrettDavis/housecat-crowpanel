name: PlatformIO firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [crowpanel, crowpanel_idf5]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-platformio.txt

      - name: Cache PlatformIO downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install pinned PlatformIO Core
        run: python -m pip install -r requirements-platformio.txt

      - name: Verify repository structure
        run: python tools/verify_repo.py

      - name: Build firmware
        run: python -m platformio run -e "${{ matrix.environment }}"

      - name: Export flash bundle
        run: python tools/export_firmware.py --env "${{ matrix.environment }}"

      - name: Upload flash bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: housecat-${{ matrix.environment }}-${{ github.sha }}
          path: dist/housecat-*/${{ matrix.environment }}/
          if-no-files-found: error
          retention-days: 30
