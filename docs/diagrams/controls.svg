<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">House Cat control grammar</title>
  <desc id="d">Five controls with their universal behavior.</desc>
  <rect width="1200" height="430" rx="28" fill="#F3EAD3"/>
  <text x="600" y="54" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="800" fill="#1E252B">FIVE CONTROLS. ONE SIMPLE GRAMMAR.</text>
  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#1E252B" text-anchor="middle">
    <g transform="translate(130 115)">
      <circle cx="0" cy="70" r="64" fill="#E56B5D" stroke="#1E252B" stroke-width="6"/>
      <path d="M0 32 L-28 70 H28 Z" fill="white"/>
      <text x="0" y="158" font-size="27" font-weight="800">UP</text><text x="0" y="191" font-size="21">Previous choice</text>
    </g>
    <g transform="translate(365 115)">
      <circle cx="0" cy="70" r="64" fill="#E56B5D" stroke="#1E252B" stroke-width="6"/>
      <path d="M0 108 L-28 70 H28 Z" fill="white"/>
      <text x="0" y="158" font-size="27" font-weight="800">DOWN</text><text x="0" y="191" font-size="21">Next choice</text>
    </g>
    <g transform="translate(600 115)">
      <circle cx="0" cy="70" r="64" fill="#D9A441" stroke="#1E252B" stroke-width="6"/>
      <circle cx="0" cy="70" r="25" fill="#1E252B"/>
      <text x="0" y="158" font-size="27" font-weight="800">CLICK</text><text x="0" y="191" font-size="21">Do the obvious thing</text>
    </g>
    <g transform="translate(835 115)">
      <circle cx="0" cy="70" r="64" fill="#3A6E6A" stroke="#1E252B" stroke-width="6"/>
      <path d="M-34 78 V44 L0 19 L34 44 V78 M-22 78 V53 H22 V78" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="158" font-size="27" font-weight="800">MENU / HOME</text><text x="0" y="191" font-size="21">Safe global place</text>
    </g>
    <g transform="translate(1070 115)">
      <circle cx="0" cy="70" r="64" fill="#1E252B" stroke="#1E252B" stroke-width="6"/>
      <path d="M30 70 H-25 M-25 70 L0 43 M-25 70 L0 97" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="158" font-size="27" font-weight="800">BACK</text><text x="0" y="191" font-size="21">Retreat one level</text>
    </g>
  </g>
  <rect x="155" y="349" width="890" height="46" rx="23" fill="#1E252B"/>
  <text x="600" y="381" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="white">Icons show the action. Short words confirm it. No hidden gestures.</text>
</svg>
